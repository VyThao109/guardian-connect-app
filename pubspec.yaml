name: guardian_connect_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  #ui
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  flutter_svg: ^2.2.1
  flutter_vlc_player: ^7.4.4
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  flutter_vector_icons: ^2.0.0
  geocoding: ^4.0.0
  intl: ^0.20.2
  url_launcher: ^6.3.2
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.4
  rx_shared_preferences: ^4.0.0
  dartx: ^1.2.0
  flutter_webrtc: ^1.2.0
  http: ^1.5.0
  flutter_local_notifications: ^19.5.0
  audioplayers: ^6.5.1
  vibration: ^3.1.4
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/sounds/zapsplat_science_fiction_alarm_small_bright_warning_114821.mp3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/icons/logo_bg.png"
  adaptive_icon_foreground: "assets/icons/logo_fg.png"
